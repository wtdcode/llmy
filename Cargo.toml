[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.22.0"
edition = "2024"
license = "MIT"
readme = "Readme.md"
description = "All-in-one LLM utilities."
homepage = "https://github.com/wtdcode/llmy"
repository = "https://github.com/wtdcode/llmy"

[workspace.dependencies]
derive_more = { version = "1" }
serde = { version = "1.0" }
clap = {version = "4"}
log = "0.4"
thiserror = "2.0"
color-eyre = "0.6"
async-openai = {version = "0.36", default-features = false}
itertools = "0.14"
serde_json = "1"
chrono = "0.4"
tracing = "0.1"
tokio = "1"
tokio-stream = "0.1"
futures = "0.3"
dyn-clone = "1"
schemars = "1"
const_format = "0.2"
fastembed = { version = "5", default-features = false }
tempfile = "3"
glob = "0.3"
globset = "0.4"
grep = { version = "0.3", features = ["pcre2"] }
ignore = "0.4"
walkdir = "2"
dotenvy = "0"
rustyline = "18"
shlex = "1"
tracing-subscriber = "0"
regex = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
axum = "0.8"
rmcp = { version = "1", default-features = false }
rust_decimal = { version = "1" }

llmy-clap = {version = "0.22.0", path = "./crates/llmy-clap", default-features = false}
llmy-client = {version = "0.22.0", path = "./crates/llmy-client", default-features = false}
llmy-types = {version = "0.22.0", path = "./crates/llmy-types", default-features = false}
llmy-tokenizer = {version = "0.22.0", path = "./crates/llmy-tokenizer"}
llmy-agent = {version = "0.22.0", path = "./crates/llmy-agent", default-features = false}
llmy-agent-tools = {version = "0.22.0", path = "./crates/llmy-agent-tools", default-features = false}
llmy-agent-derive = {version = "0.22.0", path = "./crates/llmy-agent-derive"}
llmy-harness = {version = "0.22.0", path = "./crates/llmy-harness", default-features = false}

llmy = {version = "0.22.0", path = "./crates/llmy", default-features = false}
llm-cli = {version = "0.22.0", path = "./crates/llmy-cli"}