name: Crate 📦 Distribution

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
    - uses: actions/checkout@v4

    - name: '🛠️ Set up Rust'
      uses: dtolnay/rust-toolchain@stable

    - name: '🚧 Cargo test'
      run: |
        cargo test

    # Workaround for https://github.com/rust-lang/cargo/issues/17093, which breaks
    # `cargo release`/`cargo publish` on stable. The latest nightly carries the
    # fix; only needed when cutting a release (tag push). `@nightly` tracks the
    # newest nightly (unpinned) and makes it the default toolchain, so the
    # `cargo publish` that `cargo release` shells out to runs under nightly.
    - name: '🌙 Set up nightly Rust for release'
      if: startsWith(github.ref, 'refs/tags/v')
      uses: dtolnay/rust-toolchain@nightly

    - name: '📦 Cargo Publish'
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        TOKEN: ${{ secrets.CRATES_IO_KEY }}
      run: |
        cargo login $TOKEN && cargo test && cargo install cargo-release &&\
        git config --global user.email "mio@lazym.io" && git config --global user.name "lazymio" &&\
        cargo release --execute --allow-branch '*' --no-confirm --no-push