name: Crate 📦 Distribution

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build
    steps:
    - uses: actions/checkout@v4

    - name: '🛠️ Set up Rust'
      uses: dtolnay/rust-toolchain@stable

    - name: '🚧 Cargo test'
      run: |
        cargo test

    # Workaround for https://github.com/rust-lang/cargo/issues/17093, which breaks
    # `cargo release`/`cargo publish` on stable. The latest nightly carries the
    # fix; only needed when cutting a release (tag push). `@nightly` tracks the
    # newest nightly (unpinned) and makes it the default toolchain, so the
    # `cargo publish` that `cargo release` shells out to runs under nightly.
    - name: '🌙 Set up nightly Rust for release'
      if: startsWith(github.ref, 'refs/tags/v')
      uses: dtolnay/rust-toolchain@nightly

    - name: '📦 Cargo Publish'
      if: startsWith(github.ref, 'refs/tags/v')
      env:
        TOKEN: ${{ secrets.CRATES_IO_KEY }}
        # cargo waits for each published crate to show up in the crates.io
        # index before publishing its dependents, and gives up after
        # `publish.timeout` (default 60s). The index has taken longer than
        # that for llmy-client on several tags in a row, aborting the eight
        # crates behind it. The key is nightly-only (-Zpublish-timeout); this
        # step already runs on nightly.
        CARGO_UNSTABLE_PUBLISH_TIMEOUT: 'true'
        CARGO_PUBLISH_TIMEOUT: '900'
      run: |
        cargo login $TOKEN && cargo test && cargo install cargo-release &&\
        git config --global user.email "mio@lazym.io" && git config --global user.name "lazymio" &&\
        cargo release --execute --unpublished --allow-branch '*' --no-confirm --no-push