[package]
name = "llmy-client"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
serde = {workspace = true, features = ["derive"]}
async-openai = {workspace = true, features = ["completions", "completion-types", "chat-completion", "chat-completion-types", "byot"]}
color-eyre.workspace = true
tracing.workspace = true
serde_json.workspace = true
itertools.workspace = true
tokio = {workspace = true, features = ["fs", "sync"]}
tokio-stream.workspace = true
futures.workspace = true
regex.workspace = true
sqlx.workspace = true
rust_decimal = { workspace = true, features = ["serde", "macros"] }

llmy-tokenizer.workspace = true
llmy-types.workspace = true

[features]
default = ["rustls"]

# --- TLS backend -------------------------------------------------------
#
# Cargo features are additive, so `rustls` is only *default*, never
# exclusive. To build against native-tls you must turn the default off:
#
#     llmy = { version = "0.18", default-features = false, features = ["native-tls"] }
#
# Asking for both leaves both stacks linked in, which builds but is
# almost certainly not what you want.

rustls = ["async-openai/rustls", "llmy-types/rustls"]
native-tls = ["async-openai/native-tls", "llmy-types/native-tls"]
native-tls-vendored = [
    "async-openai/native-tls-vendored",
    "llmy-types/native-tls-vendored",
]

[dev-dependencies]
tempfile.workspace = true
tokio = {workspace = true, features = ["macros", "rt-multi-thread"]}