[package]
name = "llmy"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
llmy-clap.workspace = true
llmy-client.workspace = true
llmy-agent.workspace = true
llmy-harness.workspace = true
llmy-agent-tools.workspace = true
llmy-agent-derive.workspace = true
llmy-types.workspace = true
llmy-tokenizer.workspace = true
async-openai.workspace = true

[features]
# Forwarded from `llmy-agent-tools` so downstreams can pick a TLS backend
# from the top-level crate.
default = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"]

hf-hub-native-tls = ["llmy-agent-tools/hf-hub-native-tls"]
hf-hub-rustls-tls = ["llmy-agent-tools/hf-hub-rustls-tls"]
ort-download-binaries-native-tls = ["llmy-agent-tools/ort-download-binaries-native-tls"]
ort-download-binaries-rustls-tls = ["llmy-agent-tools/ort-download-binaries-rustls-tls"]