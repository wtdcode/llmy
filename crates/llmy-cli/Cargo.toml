[package]
name = "llmy-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true

[[bin]]
name = "llmy"
path = "src/main.rs"

[dependencies]
clap = {workspace = true, features = ["derive"]}
async-openai = {workspace = true, features = ["chat-completion-types"]}
serde = {workspace = true, features = ["derive"]}
serde_json.workspace = true
chrono.workspace = true
llmy-clap.workspace = true
llmy-agent.workspace = true
llmy-agent-tools.workspace = true
llmy-harness.workspace = true
llmy-client.workspace = true
llmy-tokenizer.workspace = true
tokio = {workspace = true, features = ["full"]}
tracing.workspace = true
color-eyre.workspace = true
dotenvy.workspace = true
rustyline.workspace = true
shlex.workspace = true
tracing-subscriber = {workspace = true, features = ["env-filter"]}

[features]
# Forwarded from `llmy-agent-tools` so the CLI binary can pick a TLS backend.
default = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"]

hf-hub-native-tls = ["llmy-agent-tools/hf-hub-native-tls"]
hf-hub-rustls-tls = ["llmy-agent-tools/hf-hub-rustls-tls"]
ort-download-binaries-native-tls = ["llmy-agent-tools/ort-download-binaries-native-tls"]
ort-download-binaries-rustls-tls = ["llmy-agent-tools/ort-download-binaries-rustls-tls"]