[package]
name = "llmy-agent-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
const_format.workspace = true
glob.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "time"] }
# Optional: only pulled in when `memory-embed-search` (or one of its
# TLS-specific variants) is enabled. ort-sys does not support musl, which
# is why this is gated.
fastembed = { workspace = true, default-features = false, features = ["image-models"], optional = true }
walkdir.workspace = true
color-eyre.workspace = true
tracing.workspace = true

llmy-types.workspace = true
llmy-agent.workspace = true
llmy-agent-derive.workspace = true

[features]
# Off by default — when off, the crate does not depend on `fastembed`
# (and therefore no `ort-sys` / no `openssl-sys`), so it builds on musl.
default = []

# Activate the `memory::embed` module — exposes `SimilarityModel`,
# `Embeding`, and the local embedding helpers. Pulls in `fastembed`.
# Enabling this alone does NOT activate the memory search/cache code in
# `memory::AgentMemoryContext`; for that, use `memory-embed-search`.
embed = [
    "dep:fastembed",
    "fastembed/hf-hub-rustls-tls",
    "fastembed/ort-download-binaries-rustls-tls",
]

# Activate embedding-backed search inside `AgentMemoryContext`
# (`search_memory`, content-length validation, the SearchMemoryTool,
# per-entry embedding cache). Implies `embed`.
memory-embed-search = ["embed"]

# Granular TLS toggles for callers that need to mix and match (e.g. one
# backend rustls, the other native-tls). Each implies `dep:fastembed`,
# but NOT `embed` — pair them with `embed` (or `memory-embed-search`)
# to actually expose the embed module.
hf-hub-rustls-tls = ["dep:fastembed", "fastembed/hf-hub-rustls-tls"]
hf-hub-native-tls = ["dep:fastembed", "fastembed/hf-hub-native-tls"]
ort-download-binaries-rustls-tls = ["dep:fastembed", "fastembed/ort-download-binaries-rustls-tls"]
ort-download-binaries-native-tls = ["dep:fastembed", "fastembed/ort-download-binaries-native-tls"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }