[package]
name = "llmy-agent-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
const_format.workspace = true
glob.workspace = true
globset.workspace = true
grep.workspace = true
ignore.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "time"] }
# Optional: only pulled in when `memory-embed-search` (or one of its
# TLS-specific variants) is enabled. ort-sys does not support musl, which
# is why this is gated.
fastembed = { workspace = true, default-features = false, features = ["image-models"], optional = true }
walkdir.workspace = true
color-eyre.workspace = true
tracing.workspace = true

rmcp = {workspace = true, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest"]}

llmy-types.workspace = true
llmy-agent.workspace = true
llmy-agent-derive.workspace = true

[features]
# Off by default — when off, the crate does not depend on `fastembed`
# (and therefore no `ort-sys` / no `openssl-sys`), so it builds on musl.
default = ["rustls"]

# --- TLS backend -------------------------------------------------------
#
# Cargo features are additive, so `rustls` is only *default*, never
# exclusive. To build against native-tls you must turn the default off:
#
#     llmy = { version = "0.18", default-features = false, features = ["native-tls"] }
#
# Asking for both leaves both stacks linked in, which builds but is
# almost certainly not what you want.

# `rmcp/reqwest*` is what gives the streamable-http MCP client a TLS
# backend. Enabling only `transport-streamable-http-client-reqwest` pulls
# reqwest in with TLS switched off, which then only works by accident if
# something else in the graph happens to turn it on.
rustls = [
    "rmcp/reqwest",
    "llmy-agent/rustls",
    "llmy-types/rustls",
    "fastembed?/hf-hub-rustls-tls",
    "fastembed?/ort-download-binaries-rustls-tls",
]
native-tls = [
    "rmcp/reqwest-native-tls",
    "llmy-agent/native-tls",
    "llmy-types/native-tls",
    "fastembed?/hf-hub-native-tls",
    "fastembed?/ort-download-binaries-native-tls",
]
# `hf-hub`/`ort` have no vendored-openssl variant, so this is native-tls
# plus the vendored switch on everything that does have one.
native-tls-vendored = [
    "native-tls",
    "llmy-agent/native-tls-vendored",
    "llmy-types/native-tls-vendored",
]

# Activate the `memory::embed` module — exposes `SimilarityModel`,
# `Embeding`, and the local embedding helpers. Pulls in `fastembed`.
# Enabling this alone does NOT activate the memory search/cache code in
# `memory::AgentMemoryContext`; for that, use `memory-embed-search`.
#
# The TLS backend comes from the `rustls` / `native-tls` feature above —
# `fastembed` has no usable default here, so one of them must be on.
#
# Caveat, and the one place `native-tls` is not airtight: `hf-hub` 0.5
# declares its `ureq` dependency without `default-features = false`, and
# `ureq`'s default is rustls. So enabling `embed` links rustls in no matter
# which backend you pick — no downstream feature can switch it off. Leave
# `embed` off (the default) if a rustls-free build is a hard requirement.
embed = ["dep:fastembed"]

# Activate embedding-backed search inside `AgentMemoryContext`
# (`search_memory`, content-length validation, the SearchMemoryTool,
# per-entry embedding cache). Implies `embed`.
memory-embed-search = ["embed"]

# Granular per-backend toggles, for callers that need to mix and match
# (e.g. hf-hub over rustls but the ort download over native-tls). Each
# implies `dep:fastembed`, but NOT `embed` — pair them with `embed` (or
# `memory-embed-search`) to actually expose the embed module.
hf-hub-rustls-tls = ["dep:fastembed", "fastembed/hf-hub-rustls-tls"]
hf-hub-native-tls = ["dep:fastembed", "fastembed/hf-hub-native-tls"]
ort-download-binaries-rustls-tls = ["dep:fastembed", "fastembed/ort-download-binaries-rustls-tls"]
ort-download-binaries-native-tls = ["dep:fastembed", "fastembed/ort-download-binaries-native-tls"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }