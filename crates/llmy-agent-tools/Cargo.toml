[package]
name = "llmy-agent-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
description.workspace = true
homepage.workspace = true
repository.workspace = true

[dependencies]
const_format.workspace = true
glob.workspace = true
schemars.workspace = true
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["fs", "io-util", "process", "rt", "time"] }
# fastembed default features pull in native-tls (which drags openssl-sys).
# Disable them and let the consumer pick a TLS backend via our own feature gates.
fastembed = { workspace = true, default-features = false, features = ["image-models"] }
walkdir.workspace = true
color-eyre.workspace = true
tracing.workspace = true

llmy-types.workspace = true
llmy-agent.workspace = true
llmy-agent-derive.workspace = true

[features]
# Default: rustls everywhere. Override with `default-features = false` plus
# `hf-hub-native-tls` / `ort-download-binaries-native-tls` if you need
# system openssl (e.g. on a platform where rustls' aws-lc-rs backend won't build).
default = ["hf-hub-rustls-tls", "ort-download-binaries-rustls-tls"]

hf-hub-native-tls = ["fastembed/hf-hub-native-tls"]
hf-hub-rustls-tls = ["fastembed/hf-hub-rustls-tls"]
ort-download-binaries-native-tls = ["fastembed/ort-download-binaries-native-tls"]
ort-download-binaries-rustls-tls = ["fastembed/ort-download-binaries-rustls-tls"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }